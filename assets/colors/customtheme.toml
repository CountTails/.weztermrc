[metadata]
name = "Custom Test"
author = "Me, obviously"

[palette]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base =  "#eff1f5"
mantle =  "#e6e9ef"
crust = "#dce0e8"
derived = {color = "palette:mantle", darken = 0.5} # --> compiler resolves color to #e6e9ef then darkens by a factor of 0.5

[scheme]
foreground = "palette:text" # --> compiler would resolve to "#4c4f69"
background = "palette:base" # --> compiler would resolve to "#eff1f5"
compose_cursor = "#f2cdcd"
cursor_bg = "#f5e0dc"
cursor_border = "#f5e0dc"
cursor_fg = "#11111b"
selection_fg = {color = "palette:text", complement = true, desaturate = 0.25} # compiler resolves color to "#4c4f69", computes the complement, and desaturates the complement result
selection_bg = {color = "palette:base", darken = 0.75, desaturate = 0.25} # compiler resolves color to "#eff1f5", darkens by a factor of 0.75 and desaturates the result
indexed = { 16 = "#fab387", 17 = "#f5e0dc" }
visual_bell = "palette:surface0"
ansi = [
"palette:surface1",
"palette:red",
"palette:green",
"palette:yellow",
"palette:blue",
"palette:pink",
"palette:teal",
"palette:subtext1"
]
brights = [
"palette:surface2",
"palette:red",
"palette:green",
"palette:yellow",
"palette:blue",
"palette:pink",
"palette:teal",
"palette:subtext0"
]

[scheme.tab_bar]
background = "palette:crust"
inactive_tab_edge = "palette:surface0"

[scheme.tab_bar.active_tab]
fg_color = "palette:mauve"
bg_color = "palette:crust"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"
